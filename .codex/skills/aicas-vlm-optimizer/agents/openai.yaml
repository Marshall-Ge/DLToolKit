  short_description: "Invent novel operator & system optimizations — speculative decode, warp specialization, FP8 kernels, async pipelines"
  default_prompt: >
    Profile the Qwen3-VL model to find the #1 bottleneck, then implement
    a NOVEL optimization from: speculative decoding, chunked prefill with
